name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The pinned rustpush checkout contains anonymous-HTTPS-compatible
          # dependencies after the preparation step below.
          submodules: false
          persist-credentials: false

      - name: Prepare pinned rustpush
        run: ./scripts/prepare-rustpush.sh

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: >-
          cargo fmt
          --package litebubbles-core
          --package litebubbles-protocol
          --package litebubbles-mock-backend
          --package litebubbles-storage
          --package litebubbles-rustpush-backend
          --package litebubbles-validation-provider
          --package litebubbles-validation-helper
          --package litebubblesd
          --package litebubbles
          -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release artifacts
        run: cargo build --workspace --release
