[package]
name = "litebubbles-rustpush-backend"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[features]
# This feature only proves that rustpush's compile-time FairPlay dependency is
# gone. The corresponding rustpush path returns an explicit error if invoked.
# It must never be enabled as a production activation mechanism.
development-dummy-fairplay = ["rustpush/dummy-fairplay"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
litebubbles-core = { path = "../core" }
prost.workspace = true
litebubbles-validation-provider = { path = "../validation-provider" }
plist = "1.7"
rustpush = { package = "rustpush", path = "../../vendor/rustpush", default-features = false, features = ["remote-anisette-v3", "macos-validation-data"] }
serde.workspace = true
thiserror.workspace = true
