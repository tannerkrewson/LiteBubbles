[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/mock-backend",
    "crates/storage",
    "crates/rustpush-backend",
    "crates/validation-provider",
    "crates/validation-helper",
    "crates/daemon",
    "crates/app",
]
exclude = ["vendor/rustpush"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# rustpush's manifest patches Quinn only from its own package. Repeat the
# patch at the workspace root so Cargo uses the pinned nested implementation
# when resolving the complete workspace.
[patch.crates-io]
quinn = { path = "vendor/rustpush/third_party/quinn/quinn" }
