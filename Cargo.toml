[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/storage",
    "crates/rustpush-backend",
    "crates/daemon",
    "crates/app",
]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
